# Weekly update checks, early Sunday morning so an update (which redeploys the
# app on Streamlit Cloud) doesn't land in the middle of someone's review.
# All package updates are grouped into one pull request, which merges on its
# own once the tests pass (see workflows/dependabot-automerge.yml). If the
# tests fail, it stays open. Security fixes are opened as soon as they are
# published and merge the same way.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "03:00"
      timezone: America/New_York
    groups:
      python-packages:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "03:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ["*"]
