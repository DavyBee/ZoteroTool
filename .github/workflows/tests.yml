# Runs the tests on every push to main and on every pull request, including
# Dependabot's. Dependabot updates only merge when this passes.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
          cache: pip
      - run: pip install -r requirements.txt --group dev
      - run: python -m pyflakes app.py slack_to_zotero tests tools
      - run: python -m pytest -q
