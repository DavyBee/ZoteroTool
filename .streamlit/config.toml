[server]
# Rerun and reload changed modules when a source file is saved (local dev).
runOnSave = true

[client]
toolbarMode = "minimal"

# No fixed base: the app follows the computer's light or dark setting.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1f3a5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#1c1f24"

[theme.dark]
primaryColor = "#3f74b8"
backgroundColor = "#111418"
secondaryBackgroundColor = "#1b1f25"
textColor = "#e4e7eb"
