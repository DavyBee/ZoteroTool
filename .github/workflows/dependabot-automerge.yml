# Lets Dependabot's updates merge themselves once the required "test" check
# passes. If the tests fail, the update stays open. This relies on two
# repository settings: "Allow auto-merge", and a branch rule on main that
# requires the "test" check (without it, auto-merge would not wait for tests).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
